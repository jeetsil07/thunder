name: Deploy Thunder

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.THUNDER_DEPLOY_KEY }}

    - name: Deploy to VPS
      env:
        DJANGO_ENV: ${{ github.ref_name == 'develop' && 'develop' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'main' && 'main' }}
      run: |
        SSH_HOST="${{ secrets.VPS_USER_IP }}"
        if [[ $DJANGO_ENV == "develop" ]]; then
          PROJECT_DIR="/home/jeet/projects/backend_develop"
        elif [[ $DJANGO_ENV == "staging" ]]; then
          PROJECT_DIR="/home/jeet/projects/backend_staging"
        elif [[ $DJANGO_ENV == "main" ]]; then
          PROJECT_DIR="/home/jeet/projects/backend_main"
        fi

        ssh $SSH_HOST <<EOF
          cd $PROJECT_DIR
          git pull origin $DJANGO_ENV
          source $DJANGO_ENVthunder/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --settings=backend.settings.$DJANGO_ENV
          python manage.py collectstatic --noinput --settings=backend.settings.$DJANGO_ENV
          sudo systemctl restart gunicorn_$DJANGO_ENV
          sudo systemctl restart nginx
        EOF
